{% extends "base.html" %}
{% block title %}Élèves — Meriba{% endblock %}
{% block content %}
<section class="page active" id="page-students">
    <div class="page-header">
        <div>
            <h1 class="page-title">Élèves</h1>
            <p class="page-desc">Gestion des inscriptions et suivi des situations — {{ eleves|length }} affiché(s)</p>
        </div>
        <div class="page-actions">
            <a class="btn btn-primary" href="{% url 'students:eleve_create' %}"><i class="fas fa-user-plus"></i> Nouvel élève</a>
        </div>
    </div>

    <div class="card">
        <div class="card-header" style="gap:12px;">
            <form id="search-form-eleve" method="get" style="display:flex; gap:12px; flex:1; align-items:center; flex-wrap:wrap;" onsubmit="return false;">
                <div class="search" style="flex:1; max-width:320px;">
                    <i class="fas fa-search"></i>
                    <input class="input" name="q" value="{{ request.GET.q }}" placeholder="Rechercher par nom, matricule..."
                           hx-get="{% url 'students:eleve_list' %}"
                           hx-trigger="keyup changed delay:300ms, search"
                           hx-target="#eleve-table"
                           hx-swap="outerHTML"
                           hx-push-url="true"
                           hx-include="#search-form-eleve">
                </div>
                <select class="input" name="classe" style="width:auto; min-width:160px;"
                        hx-get="{% url 'students:eleve_list' %}"
                        hx-trigger="change"
                        hx-target="#eleve-table"
                        hx-swap="outerHTML"
                        hx-push-url="true"
                        hx-include="#search-form-eleve">
                    <option value="">Toutes les classes</option>
                    {% for c in classes %}
                    <option value="{{ c.pk }}" {% if request.GET.classe == c.pk|stringformat:"s" %}selected{% endif %}>{{ c.nom }}</option>
                    {% endfor %}
                </select>
                <span class="htmx-indicator" style="color:var(--fg-muted); font-size:12px;"><i class="fas fa-spinner fa-spin"></i></span>
                <a class="btn" href="{% url 'students:eleve_list' %}">Réinitialiser</a>
            </form>
        </div>
        {% include "students/_eleve_table.html" %}
    </div>
</section>
{% endblock %}
