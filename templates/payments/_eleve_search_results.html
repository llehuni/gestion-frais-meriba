{% if eleves %}
<div class="google-results bounce" style="background:var(--bg); border:1px solid var(--border); border-top:none; border-radius:0 0 12px 12px; box-shadow:0 8px 24px rgba(140,149,159,0.18); overflow:hidden;">
{% for e in eleves %}
<div class="google-result" data-eleve-id="{{ e.pk }}" data-eleve-label="{{ e.nom_complet }} ({{ e.matricule }} — {{ e.classe.nom }})" data-eleve-nom="{{ e.nom_complet }}" data-eleve-mat="{{ e.matricule }}" data-eleve-classe="{{ e.classe.nom }}" data-eleve-initials="{{ e.prenom|slice:':1'|upper }}{{ e.nom|slice:':1'|upper }}"
     style="padding:10px 14px; display:flex; align-items:center; gap:12px; cursor:pointer; border-bottom:1px solid var(--border-muted); transition:background 0.12s;">
<div class="avatar" style="width:32px; height:32px; font-size:12px; flex-shrink:0;">{{ e.prenom|slice:":1"|upper }}{{ e.nom|slice:":1"|upper }}</div>
<div style="flex:1; min-width:0;">
<div style="font-weight:500; font-size:13px; color:var(--fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ e.nom_complet }}</div>
<div style="font-size:12px; color:var(--fg-muted);"><span class="mono">{{ e.matricule }}</span> · <span class="label label-accent" style="font-size:11px;">{{ e.classe.nom }}</span></div>
</div>
<span style="color:var(--fg-muted); font-size:12px;"><i class="fas fa-arrow-up-right-from-square"></i></span>
</div>
{% endfor %}
</div>
<style>
@keyframes bounce{0%{opacity:0; transform:translateY(-6px) scale(0.99);} 50%{opacity:1; transform:translateY(2px) scale(1);} 100%{opacity:1; transform:translateY(0) scale(1);}}
.google-results.bounce{animation:bounce 0.32s cubic-bezier(0.34,1.56,0.64,1);}
.google-result:hover{background:var(--bg-muted);}
.google-result:last-child{border-bottom:none;}
</style>
{% elif q %}
<div style="padding:14px; text-align:center; color:var(--fg-muted); font-size:13px; background:var(--bg); border:1px solid var(--border); border-top:none; border-radius:0 0 12px 12px; box-shadow:0 8px 24px rgba(140,149,159,0.18);">Aucun élève trouvé pour « {{ q }} »</div>
{% endif %}
