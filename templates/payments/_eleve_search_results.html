{% if eleves %}
<div style="border:1px solid var(--border); border-radius:6px; overflow:hidden; background:var(--bg);">
{% for e in eleves %}
<div data-eleve-id="{{ e.pk }}" data-eleve-label="{{ e.nom_complet }} ({{ e.matricule }} — {{ e.classe.nom }})"
     style="padding:8px 12px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-muted); cursor:pointer;">
<div><strong>{{ e.nom_complet }}</strong> <span class="mono" style="color:var(--fg-muted); font-size:12px;">{{ e.matricule }}</span> — <span class="label label-accent">{{ e.classe.nom }}</span></div>
<span class="text-sm" style="color:var(--accent);"><i class="fas fa-plus"></i> Sélectionner</span>
</div>
{% endfor %}
</div>
{% elif q %}
<div style="padding:8px; color:var(--fg-muted); font-size:13px;">Aucun élève trouvé pour « {{ q }} »</div>
{% endif %}
