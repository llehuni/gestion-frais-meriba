<header class="topbar">
                <div class="topbar-left">
                    <button class="icon-btn menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                    <div class="breadcrumb">
                        <span>Meriba</span>
                        <span class="sep">/</span>
                        <strong id="crumb">Tableau de bord</strong>
                    </div>
                </div>
                <div class="topbar-right">
                    <button class="icon-btn" title="Rechercher"><i class="fas fa-search"></i></button>
                    <button class="icon-btn" title="Notifications"><i class="fas fa-bell"></i><span class="dot"></span></button>
                    <div class="user-chip" title="{{ user.get_full_name|default:user.login }} — {{ user.get_role_display }}">
                        <div class="avatar">{{ user.login|slice:":2"|upper }}</div>
                        <span class="uname">{{ user.login }}</span>
                        <span style="font-size:11px; color:var(--fg-muted); font-weight:400;">{{ user.get_role_display }}</span>
                    </div>
                    <a class="icon-btn" title="Déconnexion" href="{% url 'accounts:logout' %}"><i class="fas fa-right-from-bracket"></i></a>
                </div>
            </header>
