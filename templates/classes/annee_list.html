{% extends "base.html" %}
{% block title %}Années scolaires — Meriba{% endblock %}
{% block content %}
<section class="page active" id="page-years">
    <div class="page-header">
        <div>
            <h1 class="page-title">Années scolaires</h1>
            <p class="page-desc">Historique et configuration des années</p>
        </div>
        <div class="page-actions">
            <a class="btn btn-primary" href="{% url 'classes:annee_create' %}"><i class="fas fa-plus"></i> Nouvelle année</a>
        </div>
    </div>

    <div class="card">
        <div class="card-header" style="gap:12px;">
            <form id="search-form-annee" method="get" style="display:flex; gap:12px; flex:1; align-items:center;" onsubmit="return false;">
                <div class="search" style="flex:1; max-width:320px;">
                    <i class="fas fa-search"></i>
                    <input class="input" name="q" value="{{ request.GET.q }}" placeholder="Rechercher une année..."
                           hx-get="{% url 'classes:annee_list' %}"
                           hx-trigger="keyup changed delay:300ms, search"
                           hx-target="#annee-table"
                           hx-swap="outerHTML"
                           hx-push-url="true"
                           hx-include="#search-form-annee">
                </div>
                <span class="htmx-indicator" style="color:var(--fg-muted); font-size:12px;"><i class="fas fa-spinner fa-spin"></i></span>
            </form>
        </div>
        {% include "classes/_annee_table.html" %}
    </div>
</section>
{% endblock %}
