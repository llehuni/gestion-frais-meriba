{% extends "base.html" %}
{% block title %}Classes — Meriba{% endblock %}
{% block content %}
<section class="page active" id="page-classes">
    <div class="page-header">
        <div>
            <h1 class="page-title">Classes</h1>
            <p class="page-desc">Organisation des classes du cycle primaire — 1ère à 6ème</p>
        </div>
        <div class="page-actions">
            <a class="btn btn-primary" href="{% url 'classes:classe_create' %}"><i class="fas fa-plus"></i> Nouvelle classe</a>
        </div>
    </div>

    <div class="card">
        <div class="card-header" style="gap:12px;">
            <form id="search-form-classes" method="get" style="display:flex; gap:12px; flex:1; align-items:center; flex-wrap:wrap;" onsubmit="return false;">
                <div class="search" style="flex:1; max-width:320px;">
                    <i class="fas fa-search"></i>
                    <input class="input" name="q" value="{{ request.GET.q }}" placeholder="Rechercher une classe..."
                           hx-get="{% url 'classes:classe_list' %}"
                           hx-trigger="keyup changed delay:300ms, search"
                           hx-target="#classe-table"
                           hx-swap="outerHTML"
                           hx-push-url="true"
                           hx-include="#search-form-classes"
                           hx-indicator="#search-indicator-classes">
                </div>
                <select class="input" name="niveau" style="width:auto; min-width:160px;"
                        hx-get="{% url 'classes:classe_list' %}"
                        hx-trigger="change"
                        hx-target="#classe-table"
                        hx-swap="outerHTML"
                        hx-push-url="true"
                        hx-include="#search-form-classes">
                    <option value="">Tous les niveaux</option>
                    <option value="1" {% if request.GET.niveau == '1' %}selected{% endif %}>1ère Primaire</option>
                    <option value="2" {% if request.GET.niveau == '2' %}selected{% endif %}>2ème Primaire</option>
                    <option value="3" {% if request.GET.niveau == '3' %}selected{% endif %}>3ème Primaire</option>
                    <option value="4" {% if request.GET.niveau == '4' %}selected{% endif %}>4ème Primaire</option>
                    <option value="5" {% if request.GET.niveau == '5' %}selected{% endif %}>5ème Primaire</option>
                    <option value="6" {% if request.GET.niveau == '6' %}selected{% endif %}>6ème Primaire</option>
                </select>
                <span id="search-indicator-classes" class="htmx-indicator" style="color:var(--fg-muted); font-size:12px;"><i class="fas fa-spinner fa-spin"></i></span>
                <a class="btn" href="{% url 'classes:classe_list' %}">Réinitialiser</a>
            </form>
        </div>
        {% include "classes/_classe_table.html" %}
    </div>
</section>
{% endblock %}
