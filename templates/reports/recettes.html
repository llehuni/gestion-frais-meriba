{% extends "base.html" %}
{% block title %}Recettes {{ period }} — Meriba{% endblock %}
{% block content %}
<section class="page active">
<div class="page-header">
<div>
<h1 class="page-title">Recettes — {{ period }}</h1>
<p class="page-desc">Total : <strong>{{ total }} CDF</strong> — {{ paiements|length }} paiement(s)</p>
</div>
<div class="page-actions">
<a class="btn" href="{% url 'reports:dashboard' %}"><i class="fas fa-arrow-left"></i> Rapports</a>
<a class="btn" href="{% url 'reports:export_excel' %}?report=recettes"><i class="fas fa-file-excel"></i> Excel</a>
<a class="btn btn-primary" href="{% url 'reports:export_pdf' %}?report=recettes"><i class="fas fa-file-pdf"></i> PDF</a>
</div>
</div>
{% include "reports/_recettes_card.html" %}
</section>
{% endblock %}
